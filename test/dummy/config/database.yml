# Postgres only: thecore_auth_commons, like every Thecore gem and host app, targets Postgres
# exclusively, so tests never run on SQLite. config/boot.rb swaps DATABASE_URL's database name
# (keeping its server/credentials) for this gem's own per-environment database below.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("PGHOST", "db") %>
  port: <%= ENV.fetch("PGPORT", 5432) %>
  username: <%= ENV.fetch("PGUSER", "postgres") %>
  password: <%= ENV.fetch("PGPASSWORD", "postgres") %>

development:
  <<: *default
  database: thecore_auth_commons_development

test:
  <<: *default
  database: thecore_auth_commons_test

production:
  <<: *default
  database: thecore_auth_commons_production
